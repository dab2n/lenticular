<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenticular Card Workspace</title>
    <link rel="stylesheet" href="style.css">
    <!-- 💡 외부 라이브러리 (GIF 생성용) 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <button id="menuToggleBtn" class="menu-toggle-btn">☰</button>
            <div class="logo">LENTICULAR</div>
            <h1>Card Generator</h1>
            <button id="addSetBtn" class="add-btn">+ 새 카드 추가</button>
        </header>

        <div class="editor-layout">
            <aside class="history-panel" id="historyPanel">
                <div class="history-label">HISTORY</div>
                <div class="history-list" id="historyList"></div>
            </aside>
            <main class="active-workspace" id="activeWorkspace"></main>
        </div>
    </div>

    <template id="cardSetTemplate">
        <div class="workspace">
            <div class="panel">
                <div class="ratio-toggle">
                    <button class="ratio-btn active" data-ratio="portrait">▤ 3:4 세로</button>
                    <button class="ratio-btn" data-ratio="landscape">▥ 4:3 가로</button>
                </div>
                <div class="panel-label">이미지 업로드</div>
                <label class="drop-zone dz1">
                    <input type="file" class="file1" accept="image/*">
                    <div class="dz-body">
                        <span class="dz-name">Image 1</span>
                        <span class="dz-hint">정면 이미지</span>
                    </div>
                    <img class="dz-thumb thumb1" src="" alt="">
                    <button class="edit-btn edit-btn1">✏️ 그리기</button>
                </label>
                <div class="panel-sep">+</div>
                <label class="drop-zone dz2">
                    <input type="file" class="file2" accept="image/*">
                    <div class="dz-body">
                        <span class="dz-name">Image 2</span>
                        <span class="dz-hint">전환될 이미지</span>
                    </div>
                    <img class="dz-thumb thumb2" src="" alt="">
                    <button class="edit-btn edit-btn2">✏️ 그리기</button>
                </label>
            </div>

            <div class="stage">
                <div class="scene">
                    <div class="card">
                        <canvas class="canvas"></canvas>
                        <div class="gloss"></div>
                        <div class="idle">
                            <div class="idle-bars"><b></b><b></b><b></b><b></b><b></b><b></b></div>
                            <p>이미지를<br>업로드해주세요</p>
                        </div>
                    </div>
                </div>
                <!-- 💡 버튼들을 그룹화하고 저장 버튼 추가 -->
                <div class="stage-footer">
                    <div class="stage-hint">← 기기를 기울여보세요 →</div>
                    <div class="stage-actions">
                        <button class="workspace-motion-btn" style="display: none;">🧭 센서</button>
                        <button class="save-gif-btn">💾 GIF 저장</button>
                        <button class="share-trigger-btn">🔗 공유</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <div class="drawing-modal" id="drawingModal">
        <div class="drawing-container">
            <div class="drawing-header">
                <div class="drawing-tools">
                    <input type="color" id="penColor" class="tool-color" value="#ffffff">
                    <select id="penType" class="tool-select">
                        <option value="solid">기본 펜</option>
                        <option value="marker">형광펜</option>
                        <option value="neon">네온 펜</option>
                    </select>
                    <input type="range" id="penSize" class="tool-slider" min="1" max="30" value="5">
                    <button id="clearCanvasBtn" class="tool-btn">초기화</button>
                </div>
                <div class="drawing-actions">
                    <button id="cancelDrawBtn" class="tool-btn">취소</button>
                    <button id="saveDrawBtn" class="add-btn">저장</button>
                </div>
            </div>
            <div class="drawing-board" id="drawingBoard">
                <canvas id="drawCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- 공유 모달 -->
    <div class="share-modal" id="shareModal">
        <div class="share-container">
            <div class="share-header">
                <h3>렌티큘러 카드 완성!</h3>
                <button class="close-share-btn" id="closeShareBtn">✕</button>
            </div>
            <div class="share-body">
                <div class="share-preview-wrapper">
                    <div class="share-preview-card" id="sharePreviewCard">
                        <canvas id="shareCanvas"></canvas>
                        <div class="share-gloss" id="shareGloss"></div>
                    </div>
                </div>
                <textarea class="share-msg-input" placeholder="친구에게 전할 메시지를 남겨보세요."></textarea>
            </div>
            <div class="share-actions">
                <button class="share-copy-btn" id="copyLinkBtn">🔗 링크 복사</button>
                <button class="share-send-btn" id="sendShareBtn">전송하기</button>
            </div>
        </div>
    </div>

    <!-- 온보딩 -->
    <div class="onboarding-modal" id="onboardingModal">
        <div class="onboarding-container">
            <div class="onboarding-logo">LENTICULAR</div>
            <h2 class="onboarding-title">렌티큘러 카드<br>메이커</h2>
            <p class="onboarding-desc">두 장의 이미지가 시점에 따라<br>자연스럽게 전환되는 카드를 만들어보세요</p>
            <div class="onboarding-steps">
                <div class="onboarding-step">
                    <span class="step-num">01</span>
                    <div>
                        <div class="step-text">이미지 2장 업로드</div>
                        <div class="step-sub">정면 이미지와 전환될 이미지</div>
                    </div>
                </div>
                <div class="onboarding-step">
                    <span class="step-num">02</span>
                    <div>
                        <div class="step-text">카드 위에서 마우스 이동</div>
                        <div class="step-sub">기기 기울기로도 체험 가능</div>
                    </div>
                </div>
                <div class="onboarding-step">
                    <span class="step-num">03</span>
                    <div>
                        <div class="step-text">GIF 저장 또는 링크로 공유</div>
                        <div class="step-sub">카드를 친구에게 전달해보세요</div>
                    </div>
                </div>
            </div>
            <button id="onboardingStartBtn" class="add-btn onboarding-start-btn">시작하기 →</button>
        </div>
    </div>

    <div class="toast" id="toast">복사되었습니다.</div>
    <script src="script.js"></script>
</body>
</html>
